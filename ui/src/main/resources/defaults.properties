# The defaults of the settings, which are those of the first start. The settings that a user has changed are saved in a file of their
# own (see Settings), which has only those, so a default that is changed here is also changed for those who haven't changed it.
# The names have segments, such as view.showNames, as the levels of a nested structure would, which they can become if the format changes.

# the view
view.showNames=true
view.showRegions=false
# the speed of the bots, from 0 to 100
view.speed=70

# the rules, which are read when a new game starts
rules.keepArmiesBack=false
rules.conquestBonus=false
rules.eliminationBonus=false

# the map: its name
game.map=Classic

# who plays in each of the seats, in the corners of the map, as the name of a kind of player, or off for nobody. At least two are needed.
game.seat1=HUMAN
game.seat2=AI
game.seat3=off
game.seat4=off
