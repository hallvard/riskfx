  <line x1="12" y1="14" x2="50" y2="86" stroke-width="3"/>
  <line x1="12" y1="50" x2="50" y2="14" stroke-width="3"/>
  <line x1="12" y1="50" x2="50" y2="50" stroke-width="3"/>
  <line x1="12" y1="50" x2="50" y2="86" stroke-width="3"/>
  <line x1="12" y1="86" x2="50" y2="14" stroke-width="3"/>
  <line x1="12" y1="86" x2="50" y2="50" stroke-width="3"/>
  <line x1="12" y1="86" x2="50" y2="86" stroke-width="3"/>
  <line x1="50" y1="14" x2="88" y2="14" stroke-width="3"/>
  <line x1="50" y1="14" x2="88" y2="50" stroke-width="3"/>
  <line x1="50" y1="14" x2="88" y2="86" stroke-width="3"/>
  <line x1="50" y1="50" x2="88" y2="14" stroke-width="3"/>
  <line x1="50" y1="50" x2="88" y2="50" stroke-width="3"/>
  <line x1="50" y1="50" x2="88" y2="86" stroke-width="3"/>
