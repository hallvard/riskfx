name: "Android, changed 2026-10-21T23:01"

# Builds the native Android app (an apk) with Gluon, which can only be done on Linux. It takes a while, so it is only started when this file is
# changed and pushed to main, or by hand (Actions, Android, Run workflow, or gh workflow run android.yml), and the apk is a file of the run. It follows the setup of halban (the sokoban app).
# Gluon's GraalVM needs Java 23 or newer for this code, and the app is built with the mobile profile, which sets Java 23 and JavaFX 24.
# The Gluon plugin is documented for Maven 3.8.8 or older, so that is what is used here, not Maven 4.

# The app is signed with a key of our own, kept in the secrets of the repository, so that a new build can be installed over the old one
# on a phone. The build number is the version code, which has to rise. The apk is also the file of the release "latest", which is
# replaced each time, so https://github.com/<owner>/<repo>/releases/download/latest/riskfx.apk is always the newest.
# Secrets: ANDROID_KEYSTORE_BASE64 (the keystore file, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
# Without them, the app is signed with a debug key, which is different for each build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Java 23 and Maven 3.8.8
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-distribution: 'temurin'
          java-version: '23'
          maven-version: '3.8.8'

      # The downloads are cached: the Maven repository, what Gluon downloads (the static SDKs, and the Android SDK and NDK),
      # and Gradle. The caches are restored first, and saved last, also if the build failed, which a plain cache step doesn't do,
      # so what was downloaded is there when a failing build is tried again. The key has the poms, so it changes with the dependencies.
      - name: Restore the caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/no/hal
            ~/.gluon
            ~/.gradle
          key: android-${{ hashFiles('**/pom.xml') }}
          restore-keys: android-

      - name: Build the modules the app needs
        run: mvn --batch-mode -Pmobile -Dmaven.compiler.release=23 -pl mobile -am install -DskipTests

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '23+25.1-dev-2409082136'
          jdk: 'java23'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install linux libraries
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Prepare the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/riskfx.keystore"
            echo "profile=-Psigned" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in the secrets, so the app is signed with a debug key, and the old app must be uninstalled first."
            echo "profile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the native Android app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/riskfx.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          mvn --batch-mode -Pmobile -Pandroid ${{ steps.key.outputs.profile }} -Dmaven.compiler.release=23 \
            -Dandroid.versionCode=${{ github.run_number }} -Dandroid.versionName=1.0.${{ github.run_number }} \
            -pl mobile gluonfx:build gluonfx:package

      - name: Tree view of the Gluon build files
        run: tree mobile/target/gluonfx

      - name: Name the apk
        id: apk
        run: |
          apk=$(ls mobile/target/gluonfx/aarch64-android/gvm/*.apk | head -1)
          cp "$apk" "$RUNNER_TEMP/riskfx.apk"
          echo "file=$RUNNER_TEMP/riskfx.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the apk
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}

      # The release "latest" is made the first time, and then its file is replaced, and its text says which build it is
      - name: Publish the apk as the release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "The newest build of the Android app."
          gh release upload latest "${{ steps.apk.outputs.file }}" --clobber
          gh release edit latest --notes "Build ${{ github.run_number }} of ${GITHUB_SHA::7}, from the run ${{ github.run_id }}."

      - name: Save the caches
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/no/hal
            ~/.gluon
            ~/.gradle
          key: android-${{ hashFiles('**/pom.xml') }}
